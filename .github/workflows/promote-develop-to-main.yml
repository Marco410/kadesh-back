name: Promote develop → main

# Cuando llega código a `develop` (tras mergear un feature), abre o actualiza un PR
# `develop` → `main`. El merge a main sigue siendo manual: tú lo apruebas cuando
# hayas validado en staging / Railway develop.
#
# También se puede disparar a mano desde Actions → "Promote develop → main" → Run.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    name: Abrir o actualizar PR de release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear o actualizar PR develop → main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "::error::No existe origin/main"
            exit 1
          fi

          ahead=$(git rev-list --count origin/main..origin/develop)
          if [ "$ahead" -eq 0 ]; then
            echo "develop y main están alineados; no hay PR que abrir."
            exit 0
          fi

          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          body_file=.github/release-pr-body.md

          if [ -n "$existing" ]; then
            echo "Ya hay PR abierto #$existing; se actualiza el cuerpo."
            gh pr edit "$existing" --body-file "$body_file" || true
          else
            gh pr create \
              --base main \
              --head develop \
              --title "Release: promote develop → main" \
              --body-file "$body_file"
          fi
