name: Publish scheduled blog posts

# Dispara `publishScheduledPosts` (models/Blog/Post/Post.hooks.ts) cada hora para mandar el
# correo de "nuevo post" cuando un post programado (publishedAt a futuro) llega a su fecha y
# nadie lo vuelve a abrir en el admin. La VISIBILIDAD del post no depende de esto — los fronts
# ya filtran por fecha en cada lectura (ver models/README.md, decisión 2026-09-22).
#
# Gratis: este repo es público, así que los minutos de GitHub Actions no tienen costo. Si el
# repo pasa a privado, revisar la cuota de minutos gratis del plan antes de mantener este cron.
#
# Requiere estos secrets del repo (Settings → Secrets and variables → Actions):
#   KADESH_API_URL — endpoint GraphQL del backend en Railway, ej. https://<dominio>/api/graphql
#   CRON_SECRET     — mismo valor que CRON_SECRET en las env vars de Railway

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  publish-scheduled-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a publishScheduledPosts
        env:
          KADESH_API_URL: ${{ secrets.KADESH_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${KADESH_API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Faltan los secrets KADESH_API_URL y/o CRON_SECRET en este repo."
            exit 1
          fi

          payload=$(jq -n --arg secret "$CRON_SECRET" '{
            query: "mutation PublishScheduledPosts($secret: String!) { publishScheduledPosts(secret: $secret) { success message checked } }",
            variables: { secret: $secret }
          }')

          # Sin -f: así curl no se traga el body ni el motivo real en un error (protocolo,
          # DNS, HTTP 4xx/5xx...). Se captura el status y el body por separado y se imprimen
          # siempre, para poder diagnosticar desde el log en vez de adivinar por el exit code.
          http_status=$(curl -sS -o response.json -w "%{http_code}" -X POST "$KADESH_API_URL" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "HTTP status: $http_status"
          echo "Respuesta:"
          cat response.json | jq . 2>/dev/null || cat response.json

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::KADESH_API_URL respondió HTTP $http_status. Revisa que sea la URL GraphQL real de Railway (con https:// y sin el placeholder <tu-dominio>) y que el servicio tenga dominio público habilitado."
            exit 1
          fi

          jq -e '.data.publishScheduledPosts.success == true' response.json > /dev/null
