name: Send pet event notifications

# Dispara `sendPetEventNotifications` cada hora: recordatorios de eventos (a quienes marcaron
# «Me interesa» o «Asistiré», ~24 h antes de cada fecha) y los avisos a la zona de eventos
# aprobados cuya próxima fecha ya está a 14 días o menos. Ver models/Pet/PetEvent/README.md.
#
# Usa los mismos secrets que send-pet-reminders.yml:
#   KADESH_API_URL — endpoint GraphQL del backend en Railway
#   CRON_SECRET     — mismo valor que CRON_SECRET en las env vars de Railway

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

jobs:
  send-pet-event-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a sendPetEventNotifications
        env:
          KADESH_API_URL: ${{ secrets.KADESH_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${KADESH_API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Faltan los secrets KADESH_API_URL y/o CRON_SECRET en este repo."
            exit 1
          fi

          payload=$(jq -n --arg secret "$CRON_SECRET" '{
            query: "mutation SendPetEventNotifications($secret: String!) { sendPetEventNotifications(secret: $secret) { success message reminders zoneEvents zoneRecipients } }",
            variables: { secret: $secret }
          }')

          http_status=$(curl -sS -o response.json -w "%{http_code}" -X POST "$KADESH_API_URL" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "HTTP status: $http_status"
          echo "Respuesta:"
          cat response.json | jq . 2>/dev/null || cat response.json

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::KADESH_API_URL respondió HTTP $http_status."
            exit 1
          fi

          jq -e '.data.sendPetEventNotifications.success == true' response.json > /dev/null
