name: Send animal follow-ups

# Dispara `sendAnimalFollowUps` una vez al día (10:00 en CDMX): recuerda a quien atiende un caso
# abierto cerrarlo o actualizarlo (a la semana y a las 3 semanas sin registros) y saca del mapa los
# casos sin novedades. Ver models/Pet/Animal/README.md ("Seguimiento de casos").
#
# Requiere estos secrets del repo (Settings → Secrets and variables → Actions):
#   KADESH_API_URL — endpoint GraphQL del backend en Railway, ej. https://<dominio>/api/graphql
#   CRON_SECRET     — mismo valor que CRON_SECRET en las env vars de Railway

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  send-animal-follow-ups:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a sendAnimalFollowUps
        env:
          KADESH_API_URL: ${{ secrets.KADESH_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${KADESH_API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Faltan los secrets KADESH_API_URL y/o CRON_SECRET en este repo."
            exit 1
          fi

          payload=$(jq -n --arg secret "$CRON_SECRET" '{
            query: "mutation SendAnimalFollowUps($secret: String!) { sendAnimalFollowUps(secret: $secret) { success message reminded inactivated failed } }",
            variables: { secret: $secret }
          }')

          http_status=$(curl -sS -o response.json -w "%{http_code}" -X POST "$KADESH_API_URL" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "HTTP status: $http_status"
          echo "Respuesta:"
          cat response.json | jq . 2>/dev/null || cat response.json

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::KADESH_API_URL respondió HTTP $http_status."
            exit 1
          fi

          jq -e '.data.sendAnimalFollowUps.success == true' response.json > /dev/null
