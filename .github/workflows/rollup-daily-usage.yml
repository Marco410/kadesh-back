name: Rollup daily usage

# Dispara `rollupDailyUsage` una vez al día (01:30 en CDMX) para armar SaasCompanyDailyUsage:
# una fila por empresa y día con su uso, que alimenta la tendencia y la comparación por plan del
# 360 en Operaciones. Recalcula los últimos 3 días por si una corrida falló.
#
# Usa los mismos secrets que publish-scheduled-posts.yml:
#   KADESH_API_URL — endpoint GraphQL del backend en Railway
#   CRON_SECRET     — mismo valor que CRON_SECRET en las env vars de Railway

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}

jobs:
  rollup-daily-usage:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a rollupDailyUsage
        env:
          KADESH_API_URL: ${{ secrets.KADESH_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${KADESH_API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Faltan los secrets KADESH_API_URL y/o CRON_SECRET en este repo."
            exit 1
          fi

          payload=$(jq -n --arg secret "$CRON_SECRET" '{
            query: "mutation RollupDailyUsage($secret: String!) { rollupDailyUsage(secret: $secret, days: 3) { success message days { day companies } } }",
            variables: { secret: $secret }
          }')

          http_status=$(curl -sS -o response.json -w "%{http_code}" -X POST "$KADESH_API_URL" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "HTTP status: $http_status"
          echo "Respuesta:"
          cat response.json | jq . 2>/dev/null || cat response.json

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::KADESH_API_URL respondió HTTP $http_status."
            exit 1
          fi

          jq -e '.data.rollupDailyUsage.success == true' response.json > /dev/null
